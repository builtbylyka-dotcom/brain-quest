<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brain Quest | Play, Learn &amp; Challenge Yourself</title>
    <meta
      name="description"
      content="Play Brain Quest, a fun browser-based trivia game. Explore Bible Trivia, test your knowledge, earn achievements, and discover something new."
    />
    <meta name="author" content="Built By Lyka" />
    <meta name="theme-color" content="#F7F1E5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151A2E" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brain Quest" />
    <meta property="og:title" content="Brain Quest | Play, Learn & Challenge Yourself" />
    <meta
      property="og:description"
      content="A little challenge for a curious mind. Pick a category, answer ten questions, build streaks, and sew your own quiz quilt."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brain Quest: a patchwork of colourful quilt patches beside the game title" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brain Quest | Play, Learn & Challenge Yourself" />
    <meta name="twitter:description" content="A little challenge for a curious mind. A trivia game by Built By Lyka." />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var theme = "system";
        try {
          var s = JSON.parse(localStorage.getItem("brainquest:settings") || "{}");
          if (s && (s.theme === "light" || s.theme === "dark")) theme = s.theme;
        } catch (e) {}
        if (theme === "system") {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            theme = "light";
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">Brain Quest needs JavaScript turned on to play.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
